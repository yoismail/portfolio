<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#06091a"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(37,99,235,0.07)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="30%" cy="35%" r="55%">
      <stop offset="0%" stop-color="rgba(37,99,235,0.22)"/>
      <stop offset="100%" stop-color="rgba(37,99,235,0)"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="65%" r="40%">
      <stop offset="0%" stop-color="rgba(167,139,250,0.14)"/>
      <stop offset="100%" stop-color="rgba(167,139,250,0)"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- top-left kicker badge -->
  <g transform="translate(80, 80)">
    <rect width="220" height="34" rx="17" fill="rgba(37,99,235,0.08)" stroke="rgba(37,99,235,0.3)"/>
    <circle cx="20" cy="17" r="4" fill="#2563eb"/>
    <text x="36" y="22" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#60a5fa" letter-spacing="2">CASE STUDY · FEATURED</text>
  </g>

  <!-- main heading -->
  <text x="80" y="235" font-family="'Syne','Inter',sans-serif" font-weight="800" font-size="88" fill="#f0f0f0" letter-spacing="-3.5">Nova Retail</text>
  <text x="80" y="310" font-family="'Syne','Inter',sans-serif" font-weight="700" font-size="40" fill="url(#grad)" letter-spacing="-1.5">Dockerized medallion</text>
  <text x="80" y="358" font-family="'Syne','Inter',sans-serif" font-weight="700" font-size="40" fill="url(#grad)" letter-spacing="-1.5">data platform.</text>

  <!-- subtitle -->
  <text x="80" y="420" font-family="'IBM Plex Mono',monospace" font-size="16" fill="#8a8fa0" letter-spacing="0.5">Docker Compose · Apache Airflow · PySpark · PostgreSQL</text>

  <!-- bottom signature -->
  <g transform="translate(80, 555)">
    <text x="0" y="0" font-family="'Syne',sans-serif" font-weight="700" font-size="22" fill="#f0f0f0" letter-spacing="-0.5">Yomi Ismail</text>
    <text x="0" y="26" font-family="'IBM Plex Mono',monospace" font-size="12" fill="#2563eb" letter-spacing="2">DATA ENGINEER · SUFFOLK, UK</text>
  </g>

  <!-- right-side: 4-stage pipeline motif (Docker -> Airflow -> PySpark -> Postgres) -->
  <g transform="translate(880, 440)" opacity="0.95">
    <line x1="0" y1="0" x2="240" y2="0" stroke="rgba(37,99,235,0.3)" stroke-width="1.5"/>

    <g transform="translate(0,0)">
      <circle r="21" fill="#06091a" stroke="#2563eb" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="6" fill="#60a5fa" letter-spacing="0.3">DOCKER</text>
    </g>
    <g transform="translate(80,0)">
      <circle r="21" fill="#06091a" stroke="#2563eb" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="6" fill="#60a5fa" letter-spacing="0.3">AIRFLOW</text>
    </g>
    <g transform="translate(160,0)">
      <circle r="21" fill="#06091a" stroke="#2563eb" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="6.5" fill="#60a5fa" letter-spacing="0.3">SPARK</text>
    </g>
    <g transform="translate(240,0)">
      <circle r="25" fill="#2563eb"/>
      <circle r="25" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="6" fill="#06091a" font-weight="700" letter-spacing="0.2">POSTGRES</text>
    </g>
  </g>

  <!-- right-side label under the pipeline -->
  <text x="1000" y="505" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#606880" letter-spacing="2">5-SERVICE STACK · 3M 11S RUNTIME</text>

  <!-- bottom border accent -->
  <rect x="0" y="625" width="1200" height="5" fill="url(#grad)"/>
</svg>
