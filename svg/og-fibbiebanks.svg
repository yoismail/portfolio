<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#050402"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(16,185,129,0.07)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="30%" cy="35%" r="55%">
      <stop offset="0%" stop-color="rgba(16,185,129,0.22)"/>
      <stop offset="100%" stop-color="rgba(16,185,129,0)"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="65%" r="40%">
      <stop offset="0%" stop-color="rgba(45,212,191,0.14)"/>
      <stop offset="100%" stop-color="rgba(45,212,191,0)"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- top-left kicker badge -->
  <g transform="translate(80, 80)">
    <rect width="240" height="34" rx="17" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.3)"/>
    <circle cx="20" cy="17" r="4" fill="#10b981"/>
    <text x="36" y="22" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#34d399" letter-spacing="2">CASE STUDY · FEATURED</text>
  </g>

  <!-- main heading -->
  <text x="80" y="240" font-family="'Syne','Inter',sans-serif" font-weight="800" font-size="92" fill="#f3eee5" letter-spacing="-3.5">FibbieBanks</text>
  <text x="80" y="320" font-family="'Syne','Inter',sans-serif" font-weight="700" font-size="44" fill="url(#grad)" letter-spacing="-1.5">1M-row PySpark ETL pipeline</text>
  <text x="80" y="370" font-family="'Syne','Inter',sans-serif" font-weight="700" font-size="44" fill="url(#grad)" letter-spacing="-1.5">&amp; star schema warehouse.</text>

  <!-- subtitle -->
  <text x="80" y="430" font-family="'IBM Plex Mono',monospace" font-size="16" fill="#8a8a8a" letter-spacing="0.5">PySpark · PostgreSQL · SQLAlchemy · SHA-256 surrogate keys</text>

  <!-- bottom signature -->
  <g transform="translate(80, 555)">
    <text x="0" y="0" font-family="'Syne',sans-serif" font-weight="700" font-size="22" fill="#f3eee5" letter-spacing="-0.5">Yomi Ismail</text>
    <text x="0" y="26" font-family="'IBM Plex Mono',monospace" font-size="12" fill="#10b981" letter-spacing="2">DATA ENGINEER · SUFFOLK, UK</text>
  </g>

  <!-- right-side: star schema motif (4 dims + 1 fact) -->
  <g transform="translate(950, 305)" opacity="0.95">
    <!-- spokes — 4 dimensions arranged at 12, 3, 6, 9 o'clock -->
    <line x1="0" y1="0" x2="0" y2="-130" stroke="rgba(16,185,129,0.35)" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="130" y2="0" stroke="rgba(16,185,129,0.35)" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="130" stroke="rgba(16,185,129,0.35)" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="-130" y2="0" stroke="rgba(16,185,129,0.35)" stroke-width="1.5"/>

    <!-- dimensions (4 circles, evenly spaced at cardinal points) -->
    <g>
      <circle cx="0" cy="-130" r="22" fill="#050402" stroke="#10b981" stroke-width="2"/>
      <text x="0" y="-126" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#34d399" letter-spacing="0.5">DIM</text>
    </g>
    <g>
      <circle cx="130" cy="0" r="22" fill="#050402" stroke="#10b981" stroke-width="2"/>
      <text x="130" y="4" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#34d399" letter-spacing="0.5">DIM</text>
    </g>
    <g>
      <circle cx="0" cy="130" r="22" fill="#050402" stroke="#10b981" stroke-width="2"/>
      <text x="0" y="134" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#34d399" letter-spacing="0.5">DIM</text>
    </g>
    <g>
      <circle cx="-130" cy="0" r="22" fill="#050402" stroke="#10b981" stroke-width="2"/>
      <text x="-130" y="4" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#34d399" letter-spacing="0.5">DIM</text>
    </g>

    <!-- fact (centre, larger, filled) -->
    <circle cx="0" cy="0" r="34" fill="#10b981"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#34d399" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#050402" font-weight="700" letter-spacing="0.5">FACT</text>
  </g>

  <!-- right-side label under the schema -->
  <text x="950" y="490" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#62594c" letter-spacing="2">STAR SCHEMA · 4 DIMS · 1 FACT</text>

  <!-- bottom border accent -->
  <rect x="0" y="625" width="1200" height="5" fill="url(#grad)"/>
</svg>
