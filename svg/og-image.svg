<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#050402"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(16,185,129,0.07)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(16,185,129,0.22)"/>
      <stop offset="100%" stop-color="rgba(16,185,129,0)"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="60%" r="40%">
      <stop offset="0%" stop-color="rgba(45,212,191,0.14)"/>
      <stop offset="100%" stop-color="rgba(45,212,191,0)"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- top-left kicker badge -->
  <g transform="translate(80, 80)">
    <rect width="220" height="34" rx="17" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.3)"/>
    <circle cx="20" cy="17" r="4" fill="#10b981"/>
    <text x="36" y="22" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#34d399" letter-spacing="2">CURRENTLY AT AMDARI INC.</text>
  </g>

  <!-- main heading: three lines, third line gradient -->
  <text x="80" y="280" font-family="'Syne','Inter',sans-serif" font-weight="800" font-size="80" fill="#f3eee5" letter-spacing="-3">From fintech</text>
  <text x="80" y="370" font-family="'Syne','Inter',sans-serif" font-weight="800" font-size="80" fill="#f3eee5" letter-spacing="-3">operations,</text>
  <text x="80" y="460" font-family="'Syne','Inter',sans-serif" font-weight="800" font-size="80" fill="url(#grad)" letter-spacing="-3">to data pipelines.</text>

  <!-- subtitle: the work itself -->
  <text x="80" y="510" font-family="'IBM Plex Mono',monospace" font-size="15" fill="#8a8a8a" letter-spacing="0.5">PySpark · PostgreSQL · Star schema warehouses · Production ETL</text>

  <!-- bottom signature -->
  <g transform="translate(80, 565)">
    <text x="0" y="0" font-family="'Syne',sans-serif" font-weight="700" font-size="22" fill="#f3eee5" letter-spacing="-0.5">Yomi Ismail</text>
    <text x="0" y="26" font-family="'IBM Plex Mono',monospace" font-size="12" fill="#10b981" letter-spacing="2">DATA ENGINEER · SUFFOLK, UK</text>
  </g>

  <!-- decorative right-side stats -->
  <g opacity="0.92">
    <text x="1120" y="220" text-anchor="end" font-family="'Syne',sans-serif" font-weight="800" font-size="62" fill="#f3eee5" letter-spacing="-2">6+</text>
    <text x="1120" y="248" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#62594c" letter-spacing="2">YEARS EXPERIENCE</text>

    <text x="1120" y="335" text-anchor="end" font-family="'Syne',sans-serif" font-weight="800" font-size="62" fill="#f3eee5" letter-spacing="-2">£10K</text>
    <text x="1120" y="363" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#62594c" letter-spacing="2">QUARTERLY COST SAVED</text>

    <text x="1120" y="450" text-anchor="end" font-family="'Syne',sans-serif" font-weight="800" font-size="62" fill="#f3eee5" letter-spacing="-2">99.9%</text>
    <text x="1120" y="478" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#62594c" letter-spacing="2">SYSTEM UPTIME</text>
  </g>

  <!-- bottom border accent -->
  <rect x="0" y="625" width="1200" height="5" fill="url(#grad)"/>
</svg>
