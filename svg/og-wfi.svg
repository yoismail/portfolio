<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#06091a"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(59,130,246,0.07)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="30%" cy="35%" r="55%">
      <stop offset="0%" stop-color="rgba(59,130,246,0.22)"/>
      <stop offset="100%" stop-color="rgba(59,130,246,0)"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="65%" r="40%">
      <stop offset="0%" stop-color="rgba(52,211,153,0.14)"/>
      <stop offset="100%" stop-color="rgba(52,211,153,0)"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- top-left kicker badge -->
  <g transform="translate(80, 80)">
    <rect width="220" height="34" rx="17" fill="rgba(59,130,246,0.08)" stroke="rgba(59,130,246,0.3)"/>
    <circle cx="20" cy="17" r="4" fill="#3b82f6"/>
    <text x="36" y="22" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#22d3ee" letter-spacing="2">CASE STUDY · FEATURED</text>
  </g>

  <!-- main heading -->
  <text x="80" y="225" font-family="'Syne','Inter',sans-serif" font-weight="800" font-size="64" fill="#f0f0f0" letter-spacing="-2.5">World Football</text>
  <text x="80" y="295" font-family="'Syne','Inter',sans-serif" font-weight="800" font-size="64" fill="#f0f0f0" letter-spacing="-2.5">Insights</text>
  <text x="80" y="353" font-family="'Syne','Inter',sans-serif" font-weight="700" font-size="40" fill="url(#grad)" letter-spacing="-1.5">Serverless ELT on GCP.</text>

  <!-- subtitle -->
  <text x="80" y="415" font-family="'IBM Plex Mono',monospace" font-size="16" fill="#8a8fa0" letter-spacing="0.5">Cloud Composer · Dataproc Serverless · GCS · BigQuery</text>

  <!-- bottom signature -->
  <g transform="translate(80, 555)">
    <text x="0" y="0" font-family="'Syne',sans-serif" font-weight="700" font-size="22" fill="#f0f0f0" letter-spacing="-0.5">Yomi Ismail</text>
    <text x="0" y="26" font-family="'IBM Plex Mono',monospace" font-size="12" fill="#3b82f6" letter-spacing="2">DATA ENGINEER · SUFFOLK, UK</text>
  </g>

  <!-- right-side: 4-stage pipeline motif (Composer -> Dataproc -> GCS -> BigQuery) -->
  <g transform="translate(880, 440)" opacity="0.95">
    <line x1="0" y1="0" x2="240" y2="0" stroke="rgba(59,130,246,0.3)" stroke-width="1.5"/>

    <g transform="translate(0,0)">
      <circle r="21" fill="#06091a" stroke="#3b82f6" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="6" fill="#22d3ee" letter-spacing="0.3">COMP.</text>
    </g>
    <g transform="translate(80,0)">
      <circle r="21" fill="#06091a" stroke="#3b82f6" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="6" fill="#22d3ee" letter-spacing="0.3">PROC.</text>
    </g>
    <g transform="translate(160,0)">
      <circle r="21" fill="#06091a" stroke="#3b82f6" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="7" fill="#22d3ee" letter-spacing="0.3">GCS</text>
    </g>
    <g transform="translate(240,0)">
      <circle r="25" fill="#3b82f6"/>
      <circle r="25" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="6" fill="#06091a" font-weight="700" letter-spacing="0.2">BIGQUERY</text>
    </g>
  </g>

  <!-- right-side label under the pipeline -->
  <text x="1000" y="505" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#606880" letter-spacing="2">14-TASK DAG · 11M 53S RUNTIME</text>

  <!-- bottom border accent -->
  <rect x="0" y="625" width="1200" height="5" fill="url(#grad)"/>
</svg>
