<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(14,165,233,0.07)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="30%" cy="35%" r="55%">
      <stop offset="0%" stop-color="rgba(14,165,233,0.22)"/>
      <stop offset="100%" stop-color="rgba(14,165,233,0)"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="65%" r="40%">
      <stop offset="0%" stop-color="rgba(45,212,191,0.14)"/>
      <stop offset="100%" stop-color="rgba(45,212,191,0)"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- top-left kicker badge -->
  <g transform="translate(80, 80)">
    <rect width="240" height="34" rx="17" fill="rgba(14,165,233,0.08)" stroke="rgba(14,165,233,0.3)"/>
    <circle cx="20" cy="17" r="4" fill="#0ea5e9"/>
    <text x="36" y="22" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#22d3ee" letter-spacing="2">CASE STUDY · FEATURED</text>
  </g>

  <!-- main heading -->
  <text x="80" y="232" font-family="'Syne','Inter',sans-serif" font-weight="800" font-size="80" fill="#eef2f8" letter-spacing="-3">XTD Research Labs</text>
  <text x="80" y="308" font-family="'Syne','Inter',sans-serif" font-weight="700" font-size="42" fill="url(#grad)" letter-spacing="-1.5">Async ingestion &amp; PySpark</text>
  <text x="80" y="356" font-family="'Syne','Inter',sans-serif" font-weight="700" font-size="42" fill="url(#grad)" letter-spacing="-1.5">medallion pipeline.</text>

  <!-- subtitle -->
  <text x="80" y="416" font-family="'IBM Plex Mono',monospace" font-size="16" fill="#8a8a8a" letter-spacing="0.5">aiohttp async · PySpark · PostgreSQL · Bronze / Silver / Gold</text>

  <!-- stat row -->
  <g transform="translate(80, 462)" font-family="'IBM Plex Mono',monospace">
    <text x="0" y="0" font-size="13" fill="#22d3ee" letter-spacing="1">1,095 DAYS</text>
    <text x="150" y="0" font-size="13" fill="#62594c" letter-spacing="1">·</text>
    <text x="170" y="0" font-size="13" fill="#22d3ee" letter-spacing="1">8.7M ROWS</text>
    <text x="320" y="0" font-size="13" fill="#62594c" letter-spacing="1">·</text>
    <text x="340" y="0" font-size="13" fill="#22d3ee" letter-spacing="1">19,728 DAILY METRICS</text>
  </g>

  <!-- bottom signature -->
  <g transform="translate(80, 555)">
    <text x="0" y="0" font-family="'Syne',sans-serif" font-weight="700" font-size="22" fill="#eef2f8" letter-spacing="-0.5">Yomi Ismail</text>
    <text x="0" y="26" font-family="'IBM Plex Mono',monospace" font-size="12" fill="#0ea5e9" letter-spacing="2">DATA ENGINEER · SUFFOLK, UK</text>
  </g>

  <!-- right-side: medallion motif (Bronze -> Silver -> Gold -> warehouse) -->
  <g transform="translate(870, 195)" opacity="0.95">
    <!-- connecting flow line -->
    <line x1="80" y1="0" x2="80" y2="266" stroke="rgba(14,165,233,0.3)" stroke-width="1.5"/>

    <!-- Bronze layer -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="160" height="52" rx="10" fill="#04070f" stroke="rgba(14,165,233,0.45)" stroke-width="2"/>
      <circle cx="28" cy="26" r="11" fill="none" stroke="#cd7f4d" stroke-width="2.5"/>
      <text x="52" y="23" font-family="'IBM Plex Mono',monospace" font-size="13" fill="#eef2f8" font-weight="700" letter-spacing="1">BRONZE</text>
      <text x="52" y="40" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#8a8a8a" letter-spacing="0.5">raw JSON</text>
    </g>

    <!-- Silver layer -->
    <g transform="translate(0, 88)">
      <rect x="0" y="0" width="160" height="52" rx="10" fill="#04070f" stroke="rgba(34,211,238,0.5)" stroke-width="2"/>
      <circle cx="28" cy="26" r="11" fill="none" stroke="#c7d0d9" stroke-width="2.5"/>
      <text x="52" y="23" font-family="'IBM Plex Mono',monospace" font-size="13" fill="#eef2f8" font-weight="700" letter-spacing="1">SILVER</text>
      <text x="52" y="40" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#8a8a8a" letter-spacing="0.5">Parquet · pivoted</text>
    </g>

    <!-- Gold layer -->
    <g transform="translate(0, 176)">
      <rect x="0" y="0" width="160" height="52" rx="10" fill="#04070f" stroke="rgba(45,212,191,0.55)" stroke-width="2"/>
      <circle cx="28" cy="26" r="11" fill="none" stroke="#e0b341" stroke-width="2.5"/>
      <text x="52" y="23" font-family="'IBM Plex Mono',monospace" font-size="13" fill="#eef2f8" font-weight="700" letter-spacing="1">GOLD</text>
      <text x="52" y="40" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#8a8a8a" letter-spacing="0.5">daily aggregate</text>
    </g>

    <!-- warehouse cylinder at the end -->
    <g transform="translate(60, 262)">
      <ellipse cx="20" cy="5" rx="20" ry="6" fill="#0ea5e9"/>
      <path d="M 0 5 L 0 24 A 20 6 0 0 0 40 24 L 40 5" fill="#0a7ea4"/>
      <ellipse cx="20" cy="5" rx="20" ry="6" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <path d="M 0 5 L 0 24 A 20 6 0 0 0 40 24 L 40 5" fill="none" stroke="#22d3ee" stroke-width="2"/>
    </g>
  </g>

  <!-- right-side label under the motif -->
  <text x="950" y="520" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#62594c" letter-spacing="2">MEDALLION · 3 LAYERS · PostgreSQL</text>

  <!-- bottom border accent -->
  <rect x="0" y="625" width="1200" height="5" fill="url(#grad)"/>
</svg>
